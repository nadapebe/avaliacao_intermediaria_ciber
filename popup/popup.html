<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>PrivacyLens</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

    <img class="logo" src="../icons/icon.svg" alt="" width="28" height="28">

      <strong>PrivacyLens</strong>
      <span id="pagina" class="pagina">carregando...</span>
    </div>

  <main id="conteudo" class="conteudo"></main>

  <footer class="rodape">

  <script src="popup.js"></script>
